<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trapart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Dark mode fintech : ardoise profonde, cartes à bordure fine, accent ambre */
:root{
  color-scheme:dark;
  --bg:#05080F; --card:rgba(15,23,42,.8); --card2:#0F172A; --line:#1E293B; --line2:#2A3850;
  --ink:#FFFFFF; --text:#E2E8F0; --muted:#94A3B8; --dim:#64748B;
  --amber:#F59E0B; --amber2:#FBBF24; --amberLine:rgba(245,158,11,.4); --amberBg:rgba(245,158,11,.07);
  --pos:#34D399; --neg:#F87171;
  --s3:#FDBA74; --s1:#5EEAD4; --s2:#93C5FD; --s4:#C4B5FD;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(900px 520px at 50% -120px,rgba(245,158,11,.07),transparent 70%),var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{color:var(--ink)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,38px);line-height:1.1;margin:0;letter-spacing:-.015em}
h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 12px}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.lede{color:var(--muted);max-width:68ch;margin:0 0 22px}
.muted{color:var(--muted)} .small{font-size:13px} .pos{color:var(--pos)} .neg{color:var(--neg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hdr{position:sticky;top:0;z-index:30;background:rgba(5,8,15,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;gap:12px;height:62px}
.brandmark{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:0;color:var(--ink)}
.brandmark span{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer;color:var(--text)}
.ibtn:hover{border-color:var(--line2);color:var(--ink)}
.pbtn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:3px 12px 3px 3px;cursor:pointer;color:var(--text)}
.pbtn:hover{border-color:var(--line2)}
.pbtn .nm{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12.5px;color:#0B1220;background:linear-gradient(135deg,#FFFFFF,#94A3B8);flex:none}
.avatar.lg{width:72px;height:72px;font-size:24px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-app{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:5px 14px 5px 5px;cursor:pointer;white-space:nowrap;color:var(--text);font-weight:500;flex:none}
.chip-app:hover{border-color:var(--line2)}
.chip-app[aria-current="page"]{border-color:var(--amberLine);background:rgba(245,158,11,.06);color:var(--ink)}
.chip-app.off .logo{opacity:.4;filter:grayscale(.7)}
.pmenu{position:absolute;right:0;top:calc(100% + 10px);width:290px;background:var(--card2);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.6);padding:8px;text-align:left}
.pmenu .who{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pmenu .who small{display:block;color:var(--muted);font-size:12.5px}
.mitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--text)}
.mitem:hover{background:rgba(255,255,255,.05)}
.mitem .switch{margin-left:auto;transform:scale(.85)}
.msep{height:1px;background:var(--line);margin:6px 4px}
main{padding:26px 0 56px}
.foot{color:var(--dim);font-size:12px;text-align:center;padding:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.card.amber{border-color:var(--amberLine);box-shadow:inset 0 0 0 1px rgba(245,158,11,.08),0 0 40px rgba(245,158,11,.04)}
.ctitle{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.ctitle h2{margin:0;font-size:21px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600;color:var(--ink);text-align:right;white-space:nowrap}
.alert{border-left:2px solid var(--amber);padding:10px 14px;background:var(--amberBg);border-radius:0 10px 10px 0;margin-bottom:8px;font-size:14px;color:var(--text)}
.btn{border:1px solid var(--line2);background:transparent;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1A1203;font-weight:600}
.btn.primary:hover{background:var(--amber2)}
.btn.ghost{border-color:transparent;padding:6px 8px;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(148,163,184,.08);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--dim);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.locked{border:1px dashed var(--line2);border-radius:18px;padding:32px;text-align:center}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
label.f input,label.f select,textarea,.inp{background:#0A1020;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font-size:15px;width:100%}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.switch{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:99px;cursor:pointer;transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch input:checked+span{background:var(--amber)}
.switch input:checked+span::after{transform:translateX(18px);background:#1A1203}
.switch input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}
.price{font-family:var(--serif);font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.logo{display:block;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.phead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ptag{color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.live{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card2);color:var(--text);padding:24px;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 48px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(2,6,12,.72);backdrop-filter:blur(4px)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);color:var(--ink);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.toast.on{opacity:1}
.orbit{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);padding:0;overflow:hidden;margin-bottom:16px}
.orbit-viz{padding:14px 10px 22px;min-width:0;display:flex;flex-direction:column;align-items:center;background:radial-gradient(60% 55% at 50% 45%,rgba(245,158,11,.06),transparent 70%)}
.sat{width:100%;max-width:640px;height:auto;display:block;user-select:none;-webkit-user-select:none}
.sat text{font-family:var(--sans)}
.sat .node{cursor:pointer;transition:opacity .25s}
.sat .node:hover .halo,.sat .node:focus-visible .halo{opacity:.35}
.sat .node:focus{outline:none}
.sat .node:focus-visible .disc{stroke-width:3}
.sat.has-sel .node:not(.sel),.sat.has-sel .link:not(.sel),.sat.has-sel .seg:not(.sel){opacity:.25}
.sat .link,.sat .seg{transition:opacity .25s}
.sat .node.sel .halo{opacity:.45}
.sat .core{cursor:pointer}
.sat .spin{animation:spin 80s linear infinite;transform-origin:320px 262px}
.sat .spinr{animation:spin 130s linear infinite reverse;transform-origin:320px 262px}
@keyframes spin{to{transform:rotate(360deg)}}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:520px;margin-top:4px}
.qbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:9px 12px 9px 9px;cursor:pointer;text-align:left;color:var(--text);min-width:0}
.qbtn:hover{border-color:var(--amberLine)}
.qbtn b{display:block;color:var(--ink);font-size:15px;line-height:1.2}
.qbtn small{display:block;color:var(--muted);font-size:12.5px;line-height:1.25}
.qbtn .arrow{margin-left:auto;color:var(--dim);flex:none}
.detail{border-left:1px solid var(--line);padding:26px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.dlabel{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:14px}
.dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dhead .lbl{font-family:var(--serif);font-size:24px;color:var(--ink)}
.vsep{display:inline-block;width:1px;height:24px;background:var(--line2)}
.val{font-family:var(--serif);font-size:clamp(28px,3.4vw,38px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.sub{color:var(--muted);font-size:14px}
.brut{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14.5px;padding:2px 0 6px}
.brut b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.brut .vsep{height:16px}
.rep{display:flex;flex-direction:column}
.reprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:inherit;width:100%}
.reprow:last-child{border-bottom:0}
.reprow:hover b{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.reprow b{color:var(--ink);font-weight:600}
.reprow small{grid-column:1;color:var(--muted);font-size:13.5px}
.reprow .v{grid-row:1 / span 2;grid-column:2;align-self:center;color:var(--text);font-variant-numeric:tabular-nums;font-size:14.5px}
.reprow .track{grid-column:1 / -1;height:3px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.reprow .track i{display:block;height:100%}
.sbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;font-size:13.5px;align-items:center}
.sbar span:nth-child(2){font-variant-numeric:tabular-nums;color:var(--muted)}
.sbar .track{grid-column:1 / -1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.sbar .track i{display:block;height:100%;border-radius:2px}
.slist{display:flex;flex-direction:column;gap:11px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.invite{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.invite p{margin:0;color:var(--muted);flex:1;min-width:240px}
.sim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--card)}
.opt.best{border-color:var(--amberLine);box-shadow:0 0 0 1px rgba(245,158,11,.15)}
.opt .big{font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums;margin:6px 0 4px}
.ai{white-space:pre-wrap;font-size:14.5px;line-height:1.6;max-width:75ch}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto}
.ptabs button{border:0;background:none;color:var(--muted);padding:10px 14px;cursor:pointer;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.setrow{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow div{flex:1;min-width:0}
.setrow b{color:var(--ink)}
.setrow small{display:block;color:var(--muted);font-size:13px}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.prodcard{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--card);display:flex;flex-direction:column;gap:12px}
.prodcard b{font-size:17px;color:var(--ink)}
.search{position:fixed;inset:0;z-index:60;background:rgba(2,6,12,.72);backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:calc(70px + env(safe-area-inset-top,0px)) 12px 12px}
.spanel{width:min(620px,100%);background:var(--card2);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.sinput{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sinput input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-size:17px;outline:none}
.sres{max-height:min(60vh,480px);overflow:auto;padding:6px}
.sres .grp{font-size:12px;color:var(--dim);padding:10px 10px 4px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--text)}
.sitem:hover,.sitem:focus-visible{background:rgba(255,255,255,.05)}
.sitem b{color:var(--ink);font-weight:500}
.sitem small{display:block;color:var(--muted);font-size:12.5px}
.sitem .r{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.splash{position:fixed;inset:0;z-index:100;background:radial-gradient(70% 50% at 50% 40%,#101826 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;transition:opacity .6s ease,visibility .6s}
.splash.out{opacity:0;visibility:hidden}
.splash svg.sp{width:min(340px,82vw);height:auto;overflow:visible}
.splash h1{font-size:clamp(26px,5vw,34px);margin:20px 0 10px}
.splash p{color:var(--muted);max-width:42ch;margin:0 0 26px;line-height:1.55}
.splash .bar{width:180px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--amber2));animation:load 3s ease forwards}
.splash .skip{margin-top:22px;background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px}
.splash .skip:hover{color:var(--muted)}
.sp-sat{opacity:0;animation:lit .7s ease forwards;transform-box:fill-box;transform-origin:center}
.sp-ring{transform-origin:170px 170px;animation:spin 14s linear infinite}
@keyframes lit{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}
body.privacy .val,body.privacy .price,body.privacy .big,body.privacy td.num:not(:last-child),body.privacy .kv b,body.privacy .reprow .v,body.privacy .brut b,body.privacy .sbar span:nth-child(2),body.privacy .amt,body.privacy .alert,body.privacy .sitem .r{filter:blur(7px)}
@media (max-width:960px){ .orbit{grid-template-columns:1fr} .detail{border-left:0;border-top:1px solid var(--line)} .g3{grid-template-columns:1fr 1fr} }
@media (max-width:680px){
  .g3,.g2,.sim,.form{grid-template-columns:1fr}
  .pbtn .nm,.pbtn .chev{display:none}
  .pbtn{padding:3px}
  .brandmark span{font-size:21px}
  .detail{padding:20px}
  .card{padding:18px}
  main{padding-top:18px}
  .quick{grid-template-columns:1fr 1fr;gap:8px}
  .qbtn small{display:none}
  .sat .t-name{font-size:30px}
  .sat .t-tag{display:none}
  .sat .t-val{font-size:23px}
  .orbit-viz{padding:6px 0 18px}
  .dhead .vsep{display:none}
  .dhead{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.sp-sat{opacity:1}.splash .bar i{width:100%}}
/* ---------- V1 : fiches, prêts, projections ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .n{font-family:var(--serif);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{color:var(--dim);font-size:12.5px}
.kpi.hl{border-color:var(--amberLine)}
.namebtn{border:0;background:none;padding:0;color:var(--ink);cursor:pointer;text-align:left;font-weight:500}
.namebtn:hover{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.namebtn small{display:block;color:var(--dim);font-weight:400;font-size:12.5px}
tbody tr:hover td{background:rgba(255,255,255,.015)}
.fgroup{grid-column:1 / -1;font-size:12.5px;color:var(--amber);font-weight:600;margin:10px 0 -2px;letter-spacing:.01em}
.fgroup:first-child{margin-top:0}
.hint{font-size:12px;color:var(--dim)}
.loan{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr)) auto;gap:10px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.loan:last-of-type{border-bottom:0}
.loan .c small{display:block;color:var(--dim);font-size:12px}
.loan>.row{grid-column:auto}
.loan .c b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;background:#0A1020;flex-wrap:wrap}
.segs button{border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13.5px}
.segs button[aria-pressed="true"]{background:rgba(245,158,11,.12);color:var(--ink)}
.tbl-scroll{max-height:440px;overflow:auto;border-radius:10px}
.tbl-scroll thead th{position:sticky;top:0;background:var(--card2);z-index:1}
tfoot td{border-top:1px solid var(--line2);color:var(--ink);font-weight:600}
.formula{font-size:12.5px;color:var(--dim);margin-top:2px}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line2);padding:6px 12px;margin:10px 0 0}
.tl{position:relative;height:56px;margin:18px 4px 6px}
.tl .bar{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--line)}
.tl .fill{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:var(--s2)}
.tl .mk{position:absolute;top:12px;width:2px;height:22px;background:var(--line2)}
.tl .mk span{position:absolute;top:26px;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;color:var(--muted)}
.tl .now{background:var(--amber)}
.tl .now span{color:var(--amber);top:-16px}
.greeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.greek{border:1px solid var(--line);border-radius:12px;padding:12px;background:#0A1020}
.greek .g{font-family:var(--serif);font-size:22px;color:var(--ink)}
.greek small{display:block;color:var(--muted);font-size:12px}
.greek b{display:block;color:var(--text);font-variant-numeric:tabular-nums;font-size:14px;margin-top:4px}
.alloc{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 10px}
.alloc i{display:block;height:100%}
.pchart{position:relative}
.pchart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.pchart text{font-family:var(--sans)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:16px;height:2px;border-radius:1px}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--text);box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .12s;white-space:nowrap;z-index:2}
.tip b{color:var(--ink)}
.tip .r{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.tip .r i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pair{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.keybox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;letter-spacing:.06em;color:var(--ink);background:#0A1020;border:1px dashed var(--amberLine);border-radius:12px;padding:12px 16px;display:inline-block}
details.dev{margin-top:12px;color:var(--muted);font-size:13px}
details.dev summary{cursor:pointer;color:var(--text)}
details.dev code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text)}
details.dev li{margin:4px 0}
pre.ex{background:#0A1020;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:180px;overflow:auto;color:var(--text);white-space:pre-wrap}
.pv{grid-column:1 / -1;border:1px solid var(--amberLine);border-radius:12px;padding:12px 14px;background:rgba(245,158,11,.05);margin-top:6px}
.pv h4{margin:0 0 8px;font-size:12.5px;color:var(--amber);font-weight:600}
.pvg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px}
.pvg small{display:block;color:var(--muted);font-size:12px}
.pvg b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.methods{display:grid;gap:8px;margin-top:12px}
.methods div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.methods b{color:var(--ink);display:block;font-size:13.5px;margin-bottom:2px}
@media (max-width:680px){ .pvg{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:960px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .loan{grid-template-columns:repeat(2,minmax(0,1fr))} .loan .c:first-child{grid-column:1 / -1} .pair{grid-template-columns:1fr} .greeks{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:680px){ .kpi .n{font-size:22px} }
body.privacy .kpi .n,body.privacy .loan .c b,body.privacy .greek b,body.privacy .tip,body.privacy tfoot td,body.privacy .pchart text.v{filter:blur(7px)}
</style>

function sched(L){
  const P=num(L.montant), n=Math.round(num(L.duree)*12), r=num(L.taux)/100/12, insM=P*num(L.assurance)/100/12;
  if(!P||!n) return [];
  const st=pDate(L.debut); const base = st ? st.getFullYear()*12+st.getMonth() : nowIdx();
  const M = r ? P*r/(1-Math.pow(1+r,-n)) : P/n;
  let crd=P; const rows=[];
  for(let i=1;i<=n;i++){
    const int=crd*r; let cap;
    if(L.mode==="In fine") cap = 0;
    else if(L.mode==="Amortissement constant") cap = P/n;
    else cap = M-int;
    if(i===n) cap=crd;
    crd = Math.max(0, crd-cap);
    const idx=base+i; rows.push({i, idx, y:Math.floor(idx/12), m:idx%12+1, int, cap, ins:insM, pay:int+cap+insM, crd});
  }
  return rows;
}
function loanNow(L){
  const rows=sched(L), P=num(L.montant);
  const done = rows.filter(r=>r.idx<=nowIdx()).length;
  const next = rows[done] || null;
  return {rows, crd: done? rows[done-1].crd : P, done, n:rows.length, next,
          totInt: rows.reduce((s,r)=>s+r.int,0), totIns: rows.reduce((s,r)=>s+r.ins,0)};
}
function loanYear(L,y){ const r=sched(L).filter(x=>x.y===y); return {int:r.reduce((s,x)=>s+x.int,0), ins:r.reduce((s,x)=>s+x.ins,0), cap:r.reduce((s,x)=>s+x.cap,0)}; }

  const df = (droit==="Nue-propriété" ? 1-u : droit==="Usufruit" ? u : 1) * vf;

  const debt = loans.length ? loans.reduce((s,L)=>s+loanNow(L).crd,0)*qp : num(it.crd);

function ifi(){
  let base = 0; const detail = [];
  if(has("m3")) S.items.m3.forEach(it=>{
    const c=m3(it); let v=c.gross*c.qp*(c.vf||1), note=c.vf<1?"viager occupé, valeur occupée":"";
    if(c.droit==="Nue-propriété"){ v=0; note="nue-propriété, imposée chez l'usufruitier"; }
    else if(c.droit==="Usufruit"){ note="usufruit, imposé sur la pleine propriété"; }
    if(it.type==="Location meublée (LMP)"){ v=0; note="bien professionnel LMP, exonéré sous conditions"; }
    if(it.type==="Résidence principale" && v>0){ v*=.7; note="abattement 30 %"; }
    const net=Math.max(0, v-(v>0?c.debt:0)); base+=net; detail.push([it.nom, net, note]);
  });
  const bar = [[800000,0],[1300000,.005],[2570000,.007],[5000000,.01],[10000000,.0125],[Infinity,.015]];
  let tax = 0, prev = 0;
  if(base>1300000){ for(const [cap,r] of bar){ if(base>prev) tax += (Math.min(base,cap)-prev)*r; prev=cap; }
    if(base<1400000) tax = Math.max(0, tax - (17500 - 0.0125*base)); }
  return {base, tax, detail};
}

function Ncdf(x){ const t=1/(1+.2316419*Math.abs(x)), d=.3989422804*Math.exp(-x*x/2); const p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return x>0?1-p:p; }
const npdf = x => .3989422804*Math.exp(-x*x/2);
function bs(type,S0,K,T,r,v){
  if(T<=0||!S0||!K||!v){ const intr = type==="Call"?Math.max(0,S0-K):Math.max(0,K-S0); return {p:intr, d: type==="Call"?(S0>K?1:0):(S0<K?-1:0), g:0, th:0, ve:0}; }
  const sq=Math.sqrt(T), d1=(Math.log(S0/K)+(r+v*v/2)*T)/(v*sq), d2=d1-v*sq, disc=Math.exp(-r*T);
  const g=npdf(d1)/(S0*v*sq), ve=S0*npdf(d1)*sq/100;
  if(type==="Call") return {p:S0*Ncdf(d1)-K*disc*Ncdf(d2), d:Ncdf(d1), g, ve, th:(-S0*npdf(d1)*v/(2*sq)-r*K*disc*Ncdf(d2))/365};
  return {p:K*disc*Ncdf(-d2)-S0*Ncdf(-d1), d:Ncdf(d1)-1, g, ve, th:(-S0*npdf(d1)*v/(2*sq)+r*K*disc*Ncdf(-d2))/365};
}
function ytm(price, nom, cr, T){

  const pv=y=>times.reduce((s,t)=>s+c/Math.pow(1+y,t),0)+nom/Math.pow(1+y,T);
  let lo=-.5, hi=1; for(let k=0;k<120;k++){ const mid=(lo+hi)/2; if(pv(mid)>price) lo=mid; else hi=mid; }
  return (lo+hi)/2;
}
function vestInfo(it){

function rate4(it){
  const d=DEF4(it), g=f=>has0(it[f])?num(it[f]):(d[f]||0);
  let gross, alloc=null;
  if(ALLOC_TYPES.includes(it.type)){
    alloc=POCHES.filter(([k])=>pocheOk(it.type,k)).map(([k,label,col])=>({k,label,col,p:g("p"+k),r:g("r"+k)}));
    const tot=alloc.reduce((s,a)=>s+a.p,0); gross = tot? alloc.reduce((s,a)=>s+a.p*a.r,0)/tot : 0;
  } else gross = g("taux");
  const net = gross - (LIQ.includes(it.type)?0:g("frais")), infl=num(S.prefs.inflation);
  return {gross, net, real:((1+net/100)/(1+infl/100)-1)*100, alloc};
}
function project(items, years){
  const infl=num(S.prefs.inflation)/100, out=[];
  const st=items.map(it=>({v:num(it.valeur), c:num(it.mensuel), rm:Math.pow(1+rate4(it).net/100,1/12)-1}));
  let inv=st.reduce((s,x)=>s+x.v,0);
  out.push({y:0, nom:inv, reel:inv, inv});
  for(let y=1;y<=years;y++){
    for(let m=0;m<12;m++) st.forEach(x=>{ x.v = x.v*(1+x.rm) + x.c; });
    inv += st.reduce((s,x)=>s+x.c*12,0);
    const nom=st.reduce((s,x)=>s+x.v,0);
    out.push({y, nom, reel:nom/Math.pow(1+infl,y), inv});
  }
  return out;
}

/* ---------- Falco Core ---------- */
function m1v(it){
  const det = has0(it.detention) ? num(it.detention) : 100;
  const meth = it.methode || (num(it.ebitda)>0?"Multiple d'EBITDA":"Valeur saisie");
  if(["Holding","Société d'exploitation"].includes(it.type)){
    if(meth==="Multiple d'EBITDA") return (num(it.ebitda)*(num(it.multiple)||num(S.prefs.multiple)||5) + num(it.treso) - num(it.dette)) * det/100;
    if(meth==="DCF") return (num(it.dcf) + num(it.treso) - num(it.dette)) * det/100;
  }
  if(["Compte courant d'associé","Trésorerie pro"].includes(it.type)) return num(it.valeur);
  return num(it.valeur)*det/100;
}

/* ---------- Agrégats ---------- */
function itemValue(k,it){ return k==="m3"?m3(it).value : k==="m1"?m1v(it) : k==="m2"?m2(it).value : num(it.valeur); }
function totals(){
  const t = {gross:{},liab:0,brut:0,netTotal:0};
  MKEYS.forEach(k=>{ t.gross[k]=0; if(!has(k)) return;
    S.items[k].forEach(it=>{ t.gross[k]+=itemValue(k,it); if(k==="m3") t.liab+=m3(it).debt; }); });
  t.brut = MKEYS.reduce((s,k)=>s+t.gross[k],0);
  t.netTotal = t.brut - t.liab; t.pro = t.gross.m1; t.perso = t.netTotal - t.pro;
  return t;
}
const sumType = (k,types) => has(k) ? S.items[k].filter(i=>types.includes(i.type)).reduce((s,i)=>s+itemValue(k,i),0) : 0;
function isCalc(r){ r=Math.max(0,r); return Math.min(r,42500)*.15 + Math.max(0,r-42500)*.25; }
function fiscool(){
  const f=S.fisc, R=num(f.resultat), IS=isCalc(R), N=R-IS, D=N*Math.min(100,num(f.distrib))/100, pfu=num(f.pfu)/100;
  const A={tax:D*pfu,net:D*(1-pfu)}, B={tax:D*.05*.25,net:D-D*.05*.25}, C={tax:0,net:D};
  const besoin=Math.min(num(f.besoin),D);
  const mix={perso:besoin, hold:f.holding?D-besoin:0, res:f.holding?0:D-besoin};
  mix.tax = mix.perso*pfu + mix.hold*.0125;
  return {R,IS,N,D,A,B,C,mix,pfu};
}

const CX=320, CY=262;
function arc(r1,r2,a0,a1){
  const p=(r,a)=>[CX+r*Math.cos(a), CY+r*Math.sin(a)], large = (a1-a0)>Math.PI?1:0;
  const [x0,y0]=p(r2,a0),[x1,y1]=p(r2,a1),[x2,y2]=p(r1,a1),[x3,y3]=p(r1,a0);
  return `M${x0} ${y0}A${r2} ${r2} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r1} ${r1} 0 ${large} 0 ${x3} ${y3}Z`;
}
function satelliteSVG(t){

    let data; try{ data=JSON.parse(dlg.querySelector("#fjTxt").value); }catch(e){ toast("Le contenu n'est pas un JSON valide : vérifiez l'export Falco"); return; }
    const socs = Array.isArray(data) ? data : data.societes;
    if(!Array.isArray(socs)||!socs.length){ toast("Aucune société trouvée : le JSON doit contenir une liste « societes »"); return; }
    let n=0, created=0; const norm=x=>String(x||"").toLowerCase();
    const up=(soc,nom,type,o)=>{ const ref=norm(soc)+"|"+type, words=norm(soc).split(/[^a-zà-ÿ0-9]+/).filter(w=>w.length>3&&!["holding","société","societe"].includes(w));
      let it=S.items.m1.find(i=>i.falcoRef===ref) || S.items.m1.find(i=>i.type===type && norm(i.nom)===norm(nom))
        || (type!=="Holding"&&type!=="Société d'exploitation" ? S.items.m1.find(i=>i.type===type && !i.falcoRef && words.some(w=>norm(i.nom).includes(w))) : null)
        || (type==="Trésorerie pro" ? S.items.m1.find(i=>i.type===type && !i.falcoRef && /holding/.test(norm(soc)) && /holding/.test(norm(i.nom))) : null);
      if(!it){ it={id:uidGen(),nom,type}; S.items.m1.push(it); created++; }
      Object.assign(it,o,{source:"Falco",falcoRef:ref}); n++; };
    socs.forEach(s=>{
      if(!s||!s.nom) return;
      const meth = /dcf/i.test(s.methode||"") ? "DCF" : /ebitda/i.test(s.methode||"") ? "Multiple d'EBITDA" : "Valeur saisie";
      up(s.nom, s.nom, s.type==="Holding"?"Holding":"Société d'exploitation", {methode:meth, detention:String(s.detention??100), valeur:String(s.valeur??""), ebitda:String(s.ebitda??""), multiple:String(s.multiple??""), dcf:String(s.dcf??""), treso:String(s.tresorerie_nette??""), dette:String(s.dette??"")});
      if(num(s.tresorerie_excedentaire)>0) up(s.nom,"Trésorerie · "+s.nom,"Trésorerie pro",{valeur:String(s.tresorerie_excedentaire)});
      if(num(s.cca)>0) up(s.nom,"CCA · "+s.nom,"Compte courant d'associé",{valeur:String(s.cca)});
    });
    S.falco.status="synced"; S.falco.lastSync=new Date().toISOString(); S.falco.count=n;
    persist(); render(); toast(`Falco : ${n-created} ligne${n-created>1?"s":""} mise${n-created>1?"s":""} à jour, ${created} créée${created>1?"s":""}`);
  };
}

  const back=`<button class="btn" data-act="edit" data-k="${k}" data-id="${id}">Modifier</button><button class="btn" data-go="${k}">Retour à ${PROD[k].brand}</button>`;

function renderSearch(){
  const host=document.getElementById("searchHost");

  host.innerHTML = `<div class="search"><div class="spanel" role="dialog" aria-label="Rechercher">
    <div class="sinput">${ICON.search}<input id="sq" placeholder="Rechercher un actif, une application, un réglage" value="${esc(sq)}" autocomplete="off"><button class="btn ghost" data-act="search-close">Fermer</button></div>

  const i=document.getElementById("sq"); i.focus(); i.setSelectionRange(i.value.length,i.value.length);

function searchResults(){
  const q=sq.trim().toLowerCase(), m=s=>String(s||"").toLowerCase().includes(q);
  const apps=["cockpit","orbis","fiscool",...MKEYS].filter(k=>!q||m(PROD[k].brand)||m(PROD[k].tag)||(MODS[k]&&m(MODS[k].name)));
  const lines=[]; MKEYS.forEach(k=>S.items[k].forEach(it=>{ if(q && (m(it.nom)||m(it.type)||m(it.ticker)||m(it.isin))) lines.push([k,it]); }));
  const set=[["infos","Informations personnelles"],["abonnement","Abonnement"],["parametres","Paramètres"]].filter(([,l])=>!q||m(l));
  let h="";
  if(apps.length) h+=`<div class="grp">Applications</div>`+apps.map(k=>`<button class="sitem" data-go="${k}">${logo(k,30)}<span><b>${PROD[k].brand}</b><small>${PROD[k].tag}</small></span></button>`).join("");
  if(lines.length) h+=`<div class="grp">Actifs</div>`+lines.slice(0,12).map(([k,it])=>`<button class="sitem" data-item="${k}|${it.id}">${logo(k,30)}<span><b>${esc(it.nom||"Sans nom")}</b><small>${PROD[k].brand} · ${esc(it.type)}</small></span><span class="r">${compact(itemValue(k,it))}</span></button>`).join("");
  if(set.length) h+=`<div class="grp">Profil</div>`+set.map(([id,l])=>`<button class="sitem" data-prof="${id}">${avatar()}<span><b>${l}</b></span></button>`).join("");
  return h || `<div class="empty">Aucun résultat pour « ${esc(sq)} ».</div>`;
}

const pvc = (l,v) => `<div><small>${l}</small><b>${v}</b></div>`;
function previewM3(d){
  const loans = d.loans&&d.loans.length ? d.loans : (num(d.lMontant)? [{montant:d.lMontant,mode:d.lMode,taux:d.lTaux,duree:d.lDuree,debut:d.lDebut,assurance:d.lAssu}] : []);
  const t={...d,loans}, c=m3(t), am=amortInfo(t);
  let cells="";
  if(loans.length){ const pay=loans.reduce((s,L)=>{ const n=loanNow(L); return s+(n.next?n.next.pay:(n.rows[0]?n.rows[0].pay:0)); },0), cost=loans.reduce((s,L)=>{ const n=loanNow(L); return s+n.totInt+n.totIns; },0);
    cells+=pvc("Échéance mensuelle",eur2(pay))+pvc("Coût total du crédit",eur(cost))+pvc("Capital restant dû aujourd'hui",eur(c.debt)); }
  cells+=pvc("Valeur retenue",eur(c.value))+pvc("Valeur nette du bien",eur(c.equity));
  if(AMORT_T.includes(d.type) && num(d.prixAcq)) cells+=pvc("Valeur nette comptable, bien entier",eur(Math.max(0,num(d.prixAcq)+num(d.mobilier)-am.cum)));
  return `<h4>Calcul automatique</h4><div class="pvg">${cells}</div>`;
}
function previewM4(d){
  const r=rate4(d), p=project([d],20);
  return `<h4>Calcul automatique</h4><div class="pvg">${pvc("Rendement net espéré",pct(r.net,2))+pvc("Après inflation",pct(r.real,2))+pvc("Dans 10 ans, nominal",eur(p[10].nom))+pvc("Dans 10 ans, pouvoir d'achat",eur(p[10].reel))+pvc("Dans 20 ans, nominal",eur(p[20].nom))+pvc("Dans 20 ans, pouvoir d'achat",eur(p[20].reel))}</div>`;
}
const PREVIEW = {m3:previewM3, m4:previewM4};
function loanPreview(L,it){
  const n=loanNow(L);
  if(!n.rows.length) return `<h4>Calcul automatique</h4><p class="small muted" style="margin:0">Renseignez le montant, le taux et la durée.</p>`;
  const last=n.rows[n.rows.length-1], others=(it.loans||[]).filter(x=>x.id!==L.id), c=m3({...it,loans:[...others,L]});
  const lab = L.mode==="Amortissement constant" ? "Première échéance, puis dégressive" : L.mode==="In fine" ? "Échéance, intérêts seuls" : "Échéance constante";
  return `<h4>Calcul automatique</h4><div class="pvg">${pvc(lab,eur2(n.rows[0].pay))+pvc("Coût des intérêts",eur(n.totInt))+pvc("Coût de l'assurance",eur(n.totIns))+pvc("Capital restant dû aujourd'hui",eur(n.crd))+pvc("Dernière échéance",fmtM(last.y,last.m))+pvc("Valeur nette du bien",eur(c.equity))}</div>`;
}

    participations:S.items.m1.map(i=>({libelle:i.nom,type:i.type,valeur:Math.round(m1v(i))})),
    ifi:{assiette:Math.round(I.base),impot:Math.round(I.tax)},
    profil:{situation:S.profile.situation,regime:S.profile.regime,enfants:S.profile.enfants,tmi:S.profile.tmi},
    arbitrage:{resultat_avant_IS:r.R,IS:Math.round(r.IS),montant_arbitre:Math.round(r.D),besoin_revenus:num(S.fisc.besoin),holding:!!S.fisc.holding,taux_pfu:S.fisc.pfu}};
  btn.disabled=true; out.textContent="Analyse en cours…";
  try{
    const res = await sample(`Tu es un conseiller en gestion de patrimoine pour dirigeants d'entreprise en France. Voici le patrimoine consolidé d'un client (JSON) :\n${JSON.stringify(resume)}\n\nRédige en français, en texte brut sans markdown ni titres, 5 recommandations concrètes et chiffrées quand c'est possible, classées par impact : arbitrage dividendes/holding/réinvestissement, immobilier (régimes, déficits, IFI, démembrement), diversification, enveloppes fiscales et liquidité, transmission si le profil familial le justifie. Une recommandation par paragraphe, 2 à 3 phrases chacune. Termine par une phrase rappelant de valider avec un expert-comptable ou un avocat fiscaliste.`,
      { onText:({text})=>{ out.textContent=text; }, modelTier:"default" });
    out.textContent = res.text;
  }catch(e){
    out.textContent = e.code==="not_granted" ? "Autorisez l'accès à Claude pour obtenir l'analyse." : e.code==="rate_limited" ? "Trop de demandes rapprochées. Réessayez dans un instant." : "L'analyse n'a pas abouti. Réessayez plus tard.";
  }finally{ btn.disabled=false; }
}

/* ---------- Événements ---------- */
function go(p){ page=p; sel=null; menuOpen=false; searchOpen=false; render(); window.scrollTo(0,0); }
document.addEventListener("click", e=>{
  const T=e.target;
  if(T.closest('[data-act="skip"]')){ hideSplash(); return; }
  if(T.closest('[data-act="search-close"]') || (T.classList && T.classList.contains("search"))){ searchOpen=false; renderSearch(); return; }
  if(T.closest('[data-act="search"]')){ searchOpen=true; menuOpen=false; sq=""; renderHeader(); renderSearch(); return; }
  if(T.closest('[data-act="menu"]')){ menuOpen=!menuOpen; renderHeader(); return; }
  if(T.closest('[data-act="falco-ex"]')){ const p=dlg.querySelector("#fjEx"); if(p){ p.hidden=!p.hidden; if(!p.hidden && !dlg.querySelector("#fjTxt").value) dlg.querySelector("#fjTxt").value=JSON.stringify(FALCO_EX,null,2); } return; }
  const pr = T.closest("[data-prof]"); if(pr){ ptab=pr.dataset.prof; go("profil"); return; }
  if(menuOpen && !T.closest(".pmenu")){ menuOpen=false; renderHeader(); }
  const itb = T.closest("[data-item]"); if(itb){ const [k,id]=itb.dataset.item.split("|"); cur={k,id}; amLoan=null; amView="annuel"; go("item"); return; }
  const g = T.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const hb = T.closest("[data-h]"); if(hb){ envH=+hb.dataset.h; render(); return; }
  const al = T.closest("[data-amloan]"); if(al){ amLoan=al.dataset.amloan; render(); return; }
  const av = T.closest("[data-amview]"); if(av){ amView=av.dataset.amview; render(); return; }
  const sv = T.closest("[data-sel]");
  if(sv && document.getElementById("sat")){ const k=sv.dataset.sel; select(k && k===sel && sv.classList.contains("node") ? "" : k); return; }
  const a = T.closest("[data-act]"); if(!a || a.tagName==="INPUT") return;
  const k=a.dataset.k, id=a.dataset.id;
  switch(a.dataset.act){
    case "add": openForm(k); break;
    case "edit": openForm(k,id); break;
    case "del": if(confirm("Supprimer cette ligne ?")){ S.items[k]=S.items[k].filter(x=>x.id!==id); if(page==="item") page=k; persist(); render(); toast("Ligne supprimée"); } break;
    case "loan-add": openLoan(id); break;
    case "loan-edit": openLoan(id, a.dataset.loan); break;
    case "loan-del": { const it=S.items.m3.find(x=>x.id===id); if(it && confirm("Supprimer ce prêt ?")){ it.loans=it.loans.filter(l=>l.id!==a.dataset.loan); persist(); render(); toast("Prêt supprimé"); } break; }
    case "prices": openPrices(); break;
    case "api-save": { const k=document.getElementById("apiKey"), pv=document.getElementById("apiProv"); S.api.key=(k&&k.value||"").trim(); S.api.prov=pv?pv.value:S.api.prov; persist(); render(); toast(S.api.key?"Clé API enregistrée":"Clé API retirée"); break; }
    case "api-clear": S.api.key=""; persist(); render(); toast("Clé API retirée"); break;
    case "api-refresh": refreshPrices(); break;
    case "bank-connect": toast("L'agrégation bancaire (Powens, Flanks, Plaid) passe par le serveur Trapart : elle sera disponible avec la version hébergée."); break;
    case "import": openImport(k); break;
    case "falco-import": openFalcoImport(); break;
    case "falco-pair": { const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", g4=()=>Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join(""); S.falco.key=`TRP-${g4()}-${g4()}-${g4()}`; S.falco.status="pending"; persist(); render(); toast("Clé de jumelage générée"); break; }
    case "falco-cancel": S.falco.status = S.falco.lastSync ? "synced" : "none"; S.falco.key=""; persist(); render(); break;
    case "falco-copy": try{ navigator.clipboard.writeText(S.falco.key).then(()=>toast("Clé copiée"),()=>toast("Copie impossible : sélectionnez la clé à la main")); }catch(err){ toast("Copie impossible : sélectionnez la clé à la main"); } break;
    case "falco-oauth": toast("La connexion OAuth avec Falco nécessite le serveur Trapart. Utilisez l'import d'export Falco en attendant."); break;
    case "demo": demo(); break;
    case "splash": showSplash(); break;
    case "pack-on": S.pack=true; persist(); render(); toast("Pack Intégral activé"); break;
    case "sub-on": S.subs[k]=true; persist(); render(); toast(PROD[k].brand+" activé"); break;
    case "ai": runAI(); break;
    case "export": { const ex=JSON.parse(JSON.stringify(S)); if(ex.api) ex.api.key=ex.api.key?"(masquée)":""; const blob=JSON.stringify(ex,null,2); menuOpen=false; renderHeader();
      (window.claude&&claude.use ? claude.use("downloads") : Promise.resolve(null)).then(d=> d ? d.save({filename:"trapart-patrimoine.json",data:blob}).catch(()=>{}) : toast("Export indisponible dans cette vue")); break; }
    case "reset": if(confirm("Effacer toutes les données du patrimoine ?")){ const b=blank(); S.items=b.items; S.fisc=b.fisc; S.falco=b.falco; sel=null; persist(); render(); toast("Données effacées"); } break;
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="sq"){ sq=e.target.value; document.getElementById("sres").innerHTML=searchResults(); return; }
  const f=e.target.closest&&e.target.closest("dialog form"); if(!f) return;
  if(f.id==="loanForm"){ const it=S.items.m3.find(x=>x.id===f.dataset.itemid); if(!it) return; const fd=new FormData(f), L={id:f.dataset.loan||"__new"}; ["nom","mode","montant","taux","duree","debut","assurance"].forEach(n=>L[n]=String(fd.get(n)??"")); const box=document.getElementById("lpv"); if(box) box.innerHTML=loanPreview(L,it); return; }
  const k=f.dataset.k; if(k&&PREVIEW[k]&&openForm.k===k){ collect(k); const box=document.getElementById("pv"); if(box) box.innerHTML=PREVIEW[k](draft); }
});
let rsz; window.addEventListener("resize",()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ if(document.querySelector(".pchart")) render(); },200); });
document.addEventListener("pointermove", e=>{ if(e.target.closest && e.target.closest(".pchart")) chartMove(e); });
document.addEventListener("pointerout", e=>{ if(e.target.closest && e.target.closest(".pchart") && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".pchart"))) chartLeave(e); });
document.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); searchOpen=true; sq=""; renderSearch(); return; }
  if(e.key==="Escape"){ if(searchOpen){ searchOpen=false; renderSearch(); return; } if(menuOpen){ menuOpen=false; renderHeader(); return; } if(sel && page==="cockpit" && !dlg.open) select(""); }
  const n = e.target.closest && e.target.closest(".sat [data-sel]");
  if(n && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); const k=n.dataset.sel; select(k===sel?"":k); }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.closest && el.closest("#loanForm")){ el.dispatchEvent(new Event("input",{bubbles:true})); return; }
  if(el.closest && el.closest("dialog form[data-k]") && !el.dataset.re && PREVIEW[openForm.k]){ el.dispatchEvent(new Event("input",{bubbles:true})); return; }
  if(el.closest && el.closest("dialog") && el.dataset.re && openForm.paint){
    const k=openForm.k; collect(k);
    if(el.name==="type") (MODS[k].reset||[]).forEach(f=>delete draft[f]);
    openForm.paint(); const again=dlg.querySelector(`[name="${el.name}"]`); if(again) again.focus(); return;
  }
  if(el.dataset.act==="pack"){ S.pack=el.checked; persist(); render(); return; }
  if(el.dataset.act==="sub"){ S.subs[el.dataset.k]=el.checked; persist(); render(); return; }
  if(el.dataset.pref){ const k=el.dataset.pref; S.prefs[k] = el.type==="checkbox" ? el.checked : el.value; persist(); render(); if(k==="masquer") toast(el.checked?"Montants masqués":"Montants affichés"); return; }
  if(el.dataset.fisc){ const k=el.dataset.fisc; S.fisc[k] = k==="holding" ? el.value==="1" : el.value; persist(); render(); }
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="profForm") return; e.preventDefault();
  const fd=new FormData(e.target); Object.keys(S.profile).forEach(k=>{ if(fd.has(k)) S.profile[k]=String(fd.get(k)).trim(); });
  persist(); render(); toast("Profil enregistré");
});

loadLocal(); render();
let seen=false; try{ seen = sessionStorage.getItem("trapart-splash")==="1"; sessionStorage.setItem("trapart-splash","1"); }catch(e){}
if(!seen) showSplash();
if(window.claude && claude.use) initCloud();

</script>
